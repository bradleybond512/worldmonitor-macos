name: Lint

on:
  pull_request:
    paths:
      - '**/*.md'
      - '**/*.json'
      - '**/*.yml'
      - '**/*.yaml'
      - '**/*.sh'
      - '.husky/**'
      - 'scripts/lint-*.mjs'
      - '.markdownlint-cli2.jsonc'
      - 'package.json'
      - 'package-lock.json'

jobs:
  static-lint:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint:strict
